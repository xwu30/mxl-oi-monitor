name: Daily OI snapshot

on:
  schedule:
    # 15:30 UTC = 11:30am ET in summer, 10:30am ET in winter, Mon-Fri.
    # OCC posts updated open interest each business morning (reflecting the
    # prior session), but CBOE keeps serving the contracts that expired the
    # day before until it purges them around 9:45am ET. Fetching at 7am swept
    # those dead strikes into the snapshot and inflated total OI by up to 4%,
    # so wait them out.
    - cron: '30 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch snapshot
        run: node fetch.mjs
      # Short interest only changes twice a month, but re-fetching daily is cheap
      # and self-heals. Never let it take the OI snapshot down with it.
      - name: Fetch short interest
        continue-on-error: true
        run: node fetch-short.mjs
      # Runs on the freshly written snapshots but before the commit, so a failed
      # push never costs us the data. Skips itself when no channel secret is
      # set, so the job stays green until one is chosen.
      - name: Push anomaly alerts
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: node alert.mjs

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%F)"
          git pull --rebase
          git push
