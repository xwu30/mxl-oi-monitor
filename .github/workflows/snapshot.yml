name: Daily OI snapshot

on:
  schedule:
    # 11:00 UTC = 7:00am ET, Mon-Fri. OCC posts updated open interest each
    # business morning (reflecting the prior session), so this captures it.
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch snapshot
        run: node fetch.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%F)"
          git push
