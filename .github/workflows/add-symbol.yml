name: Add symbol

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: '股票代码（如 NVDA、AAPL）'
        required: true

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      SYM_INPUT: ${{ inputs.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate and register symbol
        run: node add-symbol.mjs "$SYM_INPUT"
      - name: Initial snapshot
        run: SYMBOL="$SYM_INPUT" node fetch.mjs
      # A symbol without short-interest data still monitors fine; the page shows
      # "等待抓取" until the next daily run picks it up.
      - name: Initial short interest
        continue-on-error: true
        run: SYMBOL="$SYM_INPUT" node fetch-short.mjs
      # symbols.json is a one-line JSON array, so two Add symbol runs started
      # seconds apart edit the same line and `git pull --rebase` dies on a
      # conflict — the losing run's symbol and the data it just fetched are both
      # thrown away. Instead of rebasing the conflicting commit, rebuild
      # symbols.json from whatever is on origin now and re-append this ticker;
      # the data/<SYM>/ files are per-symbol and never collide.
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SYM=$(printf '%s' "$SYM_INPUT" | tr '[:lower:]' '[:upper:]')
          for attempt in 1 2 3 4 5; do
            git fetch -q origin master
            # --mixed, not --soft: a soft reset keeps our stale index, so
            # committing it would silently delete every file another run pushed
            # between our checkout and now.
            git reset -q --mixed FETCH_HEAD
            git checkout -q FETCH_HEAD -- symbols.json
            node add-symbol.mjs "$SYM_INPUT" --register-only
            # Stage only this symbol's directory. `git add data` also stages the
            # removal of a data/<OTHER>/ that a concurrent run just pushed, since
            # that directory is absent from our working tree.
            git add symbols.json "data/$SYM"
            if git diff --cached --quiet; then
              echo "没有新内容需要提交"
              exit 0
            fi
            git commit -q -m "add symbol: $SYM_INPUT"
            if git push -q; then
              echo "已推送 $SYM_INPUT（第 $attempt 次尝试）"
              exit 0
            fi
            echo "推送被并发写入抢先（第 $attempt 次），重新登记后重试"
            sleep $((attempt * 3))
          done
          echo "::error::5 次尝试后仍未能推送 $SYM_INPUT"
          exit 1
