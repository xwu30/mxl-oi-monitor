name: Intraday snapshot

on:
  schedule:
    # Every 15 min through the US session. 13:35-20:50 UTC covers
    # 9:35am-4:50pm ET in summer (EDT); one hour earlier in winter (EST),
    # where the extra 21:10 run captures the 4pm close.
    - cron: '35,50 13 * * 1-5'
    - cron: '5,20,35,50 14-20 * * 1-5'
    - cron: '10 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch intraday snapshot
        run: INTRADAY=1 node fetch.mjs
      # Compares the fresh quote against the levels each AI report called out.
      # continue-on-error: a failed push must not cost the snapshot, which is the
      # data everything else is built on.
      - name: Push level alerts
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: node watch-levels.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "intraday $(date -u '+%F %H:%M')"
          git pull --rebase
          git push
