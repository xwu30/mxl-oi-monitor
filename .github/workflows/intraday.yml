name: Intraday snapshot

on:
  schedule:
    # Hourly through the US session. 13:35-20:35 UTC = 9:35am-4:35pm ET in
    # summer (EDT); one hour earlier in winter (EST), where the extra 21:10
    # run captures the 4pm close.
    - cron: '35 13-20 * * 1-5'
    - cron: '10 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch intraday snapshot
        run: INTRADAY=1 node fetch.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "intraday $(date -u '+%F %H:%M')"
          git pull --rebase
          git push
