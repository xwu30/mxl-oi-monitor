<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MXL 期权未平仓量监控</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📊</text></svg>">
<style>
  :root {
    color-scheme: light;
    --page:       #f9f9f7;
    --surface:    #fcfcfb;
    --ink:        #0b0b0b;
    --ink-2:      #52514e;
    --muted:      #898781;
    --grid:       #e1e0d9;
    --baseline:   #c3c2b7;
    --border:     rgba(11,11,11,0.10);
    --call:       #2a78d6;   /* categorical slot 1 */
    --put:        #1baf7a;   /* categorical slot 2 */
    --up:         #2a78d6;   /* diverging pole: OI 增加 */
    --down:       #e34948;   /* diverging pole: OI 减少 */
    --up-text:    #1c5cab;
    --down-text:  #c22f2e;
    --tile:       #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:       #0d0d0d;
      --surface:    #1a1a19;
      --ink:        #ffffff;
      --ink-2:      #c3c2b7;
      --muted:      #898781;
      --grid:       #2c2c2a;
      --baseline:   #383835;
      --border:     rgba(255,255,255,0.10);
      --call:       #3987e5;
      --put:        #199e70;
      --up:         #3987e5;
      --down:       #e66767;
      --up-text:    #6da7ec;
      --down-text:  #e66767;
      --tile:       #242422;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.5; padding: 20px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 700; }
  .sub { color: var(--ink-2); margin-top: 2px; font-size: 13px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .v { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .tile .d { font-size: 12px; margin-top: 2px; color: var(--ink-2); }
  .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin: 14px 0; }
  .filters label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 3px; }
  select {
    background: var(--surface); color: var(--ink); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 14px; font-family: inherit;
  }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .card h2 { font-size: 14px; font-weight: 600; }
  .card .note { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .legend { display: flex; gap: 14px; margin: 8px 0 2px; font-size: 12px; color: var(--ink-2); }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .chartscroll { overflow-x: auto; }
  .panel-title { font-size: 12px; color: var(--ink-2); margin: 10px 0 2px; font-weight: 600; }
  svg text { font-family: inherit; }
  .updn-up { color: var(--up-text); }
  .updn-down { color: var(--down-text); }
  .tablewrap { overflow-x: auto; max-height: 70vh; overflow-y: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 5px 10px; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--baseline); position: sticky; top: 0; background: var(--surface); }
  td { border-bottom: 1px solid var(--grid); }
  tr.near td { background: var(--tile); }
  td.strike { font-weight: 600; }
  th.sep, td.sep { border-left: 1px solid var(--grid); }
  .badge-new { font-size: 11px; color: var(--muted); }
  #tooltip {
    position: fixed; pointer-events: none; display: none; z-index: 10;
    background: var(--surface); color: var(--ink); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18); font-variant-numeric: tabular-nums;
  }
  #tooltip .t { color: var(--muted); }
  .msg { padding: 30px; text-align: center; color: var(--muted); }
  footer { color: var(--muted); font-size: 12px; margin: 18px 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>MXL 期权未平仓量（OI）每日变化</h1>
  <div class="sub" id="subline">加载中…</div>

  <div class="tiles" id="tiles"></div>

  <div class="filters">
    <div><label for="selExp">到期日</label><select id="selExp"></select></div>
    <div><label for="selCur">数据日期</label><select id="selCur"></select></div>
    <div><label for="selBase">对比基准日</label><select id="selBase"></select></div>
  </div>

  <div class="card">
    <h2>OI 变化 ΔOI（按行权价）</h2>
    <div class="note" id="deltaNote"></div>
    <div class="legend">
      <span><span class="sw" style="background:var(--up)"></span>增加 ▲</span>
      <span><span class="sw" style="background:var(--down)"></span>减少 ▼</span>
    </div>
    <div class="panel-title">Call ΔOI</div>
    <div class="chartscroll" id="chartDeltaCall"></div>
    <div class="panel-title" id="putPanelTitle">Put ΔOI</div>
    <div class="chartscroll" id="chartDeltaPut"></div>
  </div>

  <div class="card">
    <h2>当前 OI 分布（按行权价）</h2>
    <div class="note" id="distNote"></div>
    <div class="legend">
      <span><span class="sw" style="background:var(--call)"></span>Call OI</span>
      <span><span class="sw" style="background:var(--put)"></span>Put OI</span>
    </div>
    <div class="chartscroll" id="chartDist"></div>
  </div>

  <div class="card">
    <h2>明细表</h2>
    <div class="note">Δ 为「数据日期」相对「对比基准日」的变化；灰底行为最接近现价的行权价。</div>
    <div class="tablewrap" id="tableBox"></div>
  </div>

  <footer>
    数据来源：CBOE 延迟行情（免费公开接口）。未平仓量由 OCC 每个交易日早间更新，反映上一交易日收盘后的持仓；
    本站每个交易日 7:00am ET 自动抓取快照。<span id="fetchedAt"></span>
  </footer>
</div>
<div id="tooltip"></div>

<script>
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('en-US');
const cache = new Map();
let INDEX = null;

async function loadSnap(date) {
  if (!cache.has(date)) {
    const r = await fetch(`data/${date}.json`);
    if (!r.ok) throw new Error(`missing snapshot ${date}`);
    cache.set(date, await r.json());
  }
  return cache.get(date);
}

// rows for one snapshot filtered by expiry ('ALL' aggregates across expiries by strike)
function rowsOf(snap, expiry) {
  const m = new Map();
  for (const [exp, strike, c, p, cv, pv] of snap.options) {
    if (expiry !== 'ALL' && exp !== expiry) continue;
    if (!m.has(strike)) m.set(strike, { c: 0, p: 0, cv: 0, pv: 0 });
    const r = m.get(strike);
    r.c += c; r.p += p; r.cv += cv; r.pv += pv;
  }
  return m;
}

function buildDiff(cur, base, expiry) {
  const a = rowsOf(cur, expiry);
  const b = base ? rowsOf(base, expiry) : null;
  const strikes = [...new Set([...a.keys(), ...(b ? b.keys() : [])])].sort((x, y) => x - y);
  return strikes.map(k => {
    const r = a.get(k) || { c: 0, p: 0, cv: 0, pv: 0 };
    const o = b ? (b.get(k) || null) : null;
    return {
      strike: k,
      c: r.c, p: r.p, cv: r.cv, pv: r.pv,
      dc: b ? r.c - (o ? o.c : 0) : null,
      dp: b ? r.p - (o ? o.p : 0) : null,
      isNew: b ? !o : false,
    };
  });
}

// ---------- tooltip ----------
const tip = $('tooltip');
function bindTips(root) {
  root.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mouseenter', () => { tip.innerHTML = el.dataset.tip; tip.style.display = 'block'; });
    el.addEventListener('mousemove', e => {
      const pad = 14;
      let x = e.clientX + pad, y = e.clientY + pad;
      const r = tip.getBoundingClientRect();
      if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
      if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    });
    el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  });
}

// ---------- charts ----------
const CSS = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function xLayout(n, minBar, group) {
  const gap = 2, slot = Math.max(minBar * group + gap, 14);
  const padL = 46, padR = 12;
  return { slot, padL, padR, width: padL + n * slot + padR };
}

function axisTicks(rows, layout, h, spot) {
  const n = rows.length, every = Math.ceil(n / 14);
  let s = '';
  rows.forEach((r, i) => {
    if (i % every !== 0) return;
    const x = layout.padL + i * layout.slot + layout.slot / 2;
    s += `<text x="${x}" y="${h - 6}" text-anchor="middle" font-size="10" fill="${CSS('--muted')}">${r.strike}</text>`;
  });
  // spot marker between the two nearest strikes
  if (spot != null && n > 1) {
    let xi = null;
    for (let i = 0; i < n; i++) {
      if (rows[i].strike <= spot && (i === n - 1 || rows[i + 1].strike > spot)) {
        const a = rows[i].strike, b = rows[Math.min(i + 1, n - 1)].strike;
        const f = b > a ? (spot - a) / (b - a) : 0;
        xi = layout.padL + (i + 0.5 + f) * layout.slot;
        break;
      }
    }
    if (spot < rows[0].strike) xi = layout.padL + 2;
    if (xi != null) {
      s += `<line x1="${xi}" y1="14" x2="${xi}" y2="${h - 20}" stroke="${CSS('--muted')}" stroke-dasharray="3 3" stroke-width="1"/>`;
      s += `<text x="${xi + 4}" y="14" font-size="10" fill="${CSS('--muted')}">现价 ${spot}</text>`;
    }
  }
  return s;
}

function renderDelta(box, rows, key, spot, baseDate) {
  const data = rows.map(r => ({ strike: r.strike, v: r[key] ?? 0, isNew: r.isNew }));
  const H = 190, L = xLayout(data.length, 8, 1);
  const maxAbs = Math.max(1, ...data.map(d => Math.abs(d.v)));
  const top = 22, bottom = 24, mid = top + (H - top - bottom) / 2, half = (H - top - bottom) / 2;
  const y = v => mid - (v / maxAbs) * half;
  const up = CSS('--up'), down = CSS('--down');
  const label = key === 'dc' ? 'Call' : 'Put';
  let bars = '';
  let maxUp = null, maxDn = null;
  data.forEach(d => {
    if (d.v > 0 && (!maxUp || d.v > maxUp.v)) maxUp = d;
    if (d.v < 0 && (!maxDn || d.v < maxDn.v)) maxDn = d;
  });
  data.forEach((d, i) => {
    const x = L.padL + i * L.slot + (L.slot - 8) / 2;
    const sign = d.v > 0 ? '+' : '';
    const tipTxt = `<b>${label} $${d.strike}</b>${d.isNew ? ' <span class=t>(新增档位)</span>' : ''}<br>ΔOI: <b>${sign}${fmt(d.v)}</b> <span class=t>vs ${baseDate}</span>`;
    // invisible full-height hit target (wider than the mark)
    bars += `<rect x="${x - 3}" y="${top}" width="14" height="${H - top - bottom}" fill="transparent" data-tip="${tipTxt.replace(/"/g, '&quot;')}"/>`;
    if (d.v === 0) return;
    const h = Math.max(2, Math.abs(y(d.v) - mid));
    const yy = d.v > 0 ? mid - h : mid;
    const col = d.v > 0 ? up : down;
    const path = d.v > 0
      ? `M${x},${yy + h} V${yy + 4} Q${x},${yy} ${x + 4},${yy} Q${x + 8},${yy} ${x + 8},${yy + 4} V${yy + h} Z`
      : `M${x},${yy} V${yy + h - 4} Q${x},${yy + h} ${x + 4},${yy + h} Q${x + 8},${yy + h} ${x + 8},${yy + h - 4} V${yy} Z`;
    bars += `<path d="${path}" fill="${col}" pointer-events="none"/>`;
    if ((maxUp && d === maxUp) || (maxDn && d === maxDn)) {
      const ly = d.v > 0 ? yy - 4 : yy + h + 11;
      bars += `<text x="${x + 4}" y="${ly}" text-anchor="middle" font-size="10" font-weight="600" fill="${CSS('--ink-2')}">${sign}${fmt(d.v)}</text>`;
    }
  });
  const svg = `<svg width="${Math.max(L.width, 320)}" height="${H}" role="img" aria-label="${label} 每个行权价的未平仓量变化柱状图">
    <line x1="${L.padL - 6}" y1="${mid}" x2="${L.width - L.padR + 4}" y2="${mid}" stroke="${CSS('--baseline')}" stroke-width="1"/>
    <text x="${L.padL - 10}" y="${y(maxAbs) + 4}" text-anchor="end" font-size="10" fill="${CSS('--muted')}">+${fmt(maxAbs)}</text>
    <text x="${L.padL - 10}" y="${mid + 4}" text-anchor="end" font-size="10" fill="${CSS('--muted')}">0</text>
    <text x="${L.padL - 10}" y="${y(-maxAbs) + 4}" text-anchor="end" font-size="10" fill="${CSS('--muted')}">-${fmt(maxAbs)}</text>
    ${bars}${axisTicks(rows, L, H, spot)}</svg>`;
  box.innerHTML = data.every(d => d.v === 0) ? '<div class="msg">该区间内 OI 无变化</div>' : svg;
  bindTips(box);
}

function renderDist(box, rows, spot) {
  const H = 210, L = xLayout(rows.length, 6, 2);
  const maxV = Math.max(1, ...rows.map(r => Math.max(r.c, r.p)));
  const top = 22, bottom = 24, plotH = H - top - bottom;
  const y = v => top + plotH - (v / maxV) * plotH;
  const call = CSS('--call'), put = CSS('--put');
  let bars = '';
  rows.forEach((r, i) => {
    const x0 = L.padL + i * L.slot + (L.slot - 14) / 2;
    [['c', call, 'Call', 0], ['p', put, 'Put', 8]].forEach(([k, col, name, off]) => {
      const v = r[k];
      const tipTxt = `<b>$${r.strike}</b><br>${name} OI: <b>${fmt(v)}</b>`;
      bars += `<rect x="${x0 + off - 1}" y="${top}" width="8" height="${plotH}" fill="transparent" data-tip="${tipTxt.replace(/"/g, '&quot;')}"/>`;
      if (v > 0) {
        const h = Math.max(2, top + plotH - y(v));
        const yy = top + plotH - h;
        bars += `<path d="M${x0 + off},${top + plotH} V${yy + 3} Q${x0 + off},${yy} ${x0 + off + 3},${yy} Q${x0 + off + 6},${yy} ${x0 + off + 6},${yy + 3} V${top + plotH} Z" fill="${col}" pointer-events="none"/>`;
      }
    });
  });
  const svg = `<svg width="${Math.max(L.width, 320)}" height="${H}" role="img" aria-label="每个行权价的 Call 与 Put 未平仓量分布柱状图">
    <line x1="${L.padL - 6}" y1="${top + plotH}" x2="${L.width - L.padR + 4}" y2="${top + plotH}" stroke="${CSS('--baseline')}" stroke-width="1"/>
    <line x1="${L.padL - 6}" y1="${y(maxV)}" x2="${L.width - L.padR + 4}" y2="${y(maxV)}" stroke="${CSS('--grid')}" stroke-width="1"/>
    <text x="${L.padL - 10}" y="${y(maxV) + 4}" text-anchor="end" font-size="10" fill="${CSS('--muted')}">${fmt(maxV)}</text>
    <text x="${L.padL - 10}" y="${top + plotH + 4}" text-anchor="end" font-size="10" fill="${CSS('--muted')}">0</text>
    ${bars}${axisTicks(rows, L, H, spot)}</svg>`;
  box.innerHTML = svg;
  bindTips(box);
}

// ---------- table ----------
function deltaCell(v, isNew) {
  if (v == null) return '<td>—</td>';
  if (v === 0) return `<td style="color:var(--muted)">0</td>`;
  const cls = v > 0 ? 'updn-up' : 'updn-down';
  const arrow = v > 0 ? '▲' : '▼';
  return `<td class="${cls}"><b>${v > 0 ? '+' : ''}${fmt(v)}</b> ${arrow}${isNew ? ' <span class="badge-new">新</span>' : ''}</td>`;
}

function renderTable(rows, spot) {
  let nearIdx = -1, best = Infinity;
  rows.forEach((r, i) => { const d = Math.abs(r.strike - spot); if (d < best) { best = d; nearIdx = i; } });
  let html = `<table><thead><tr>
    <th>行权价</th>
    <th class="sep">Call OI</th><th>ΔCall</th><th>Call 量</th>
    <th class="sep">Put OI</th><th>ΔPut</th><th>Put 量</th>
  </tr></thead><tbody>`;
  rows.forEach((r, i) => {
    html += `<tr${i === nearIdx ? ' class="near"' : ''}>
      <td class="strike">$${r.strike}</td>
      <td class="sep">${fmt(r.c)}</td>${deltaCell(r.dc, r.isNew)}<td style="color:var(--ink-2)">${fmt(r.cv)}</td>
      <td class="sep">${fmt(r.p)}</td>${deltaCell(r.dp, r.isNew)}<td style="color:var(--ink-2)">${fmt(r.pv)}</td>
    </tr>`;
  });
  $('tableBox').innerHTML = html + '</tbody></table>';
}

// ---------- tiles ----------
function tile(k, v, d) {
  return `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${d ? `<div class="d">${d}</div>` : ''}</div>`;
}
function signedSpan(v) {
  if (v == null) return '<span style="color:var(--muted)">无对比数据</span>';
  if (v === 0) return '<span style="color:var(--muted)">持平</span>';
  const cls = v > 0 ? 'updn-up' : 'updn-down';
  return `<span class="${cls}">${v > 0 ? '+' : ''}${fmt(v)} ${v > 0 ? '▲' : '▼'}</span>`;
}
function renderTiles(cur, rows, baseDate) {
  const tc = rows.reduce((s, r) => s + r.c, 0), tp = rows.reduce((s, r) => s + r.p, 0);
  const hasBase = rows.some(r => r.dc != null);
  const dtc = hasBase ? rows.reduce((s, r) => s + (r.dc || 0), 0) : null;
  const dtp = hasBase ? rows.reduce((s, r) => s + (r.dp || 0), 0) : null;
  const chg = cur.prev_close ? ((cur.spot - cur.prev_close) / cur.prev_close * 100).toFixed(2) : null;
  $('tiles').innerHTML =
    tile('正股价', `$${cur.spot}`, chg != null ? `较前收 ${chg > 0 ? '+' : ''}${chg}%` : '') +
    tile('Call 总 OI', fmt(tc), `Δ ${signedSpan(dtc)}${hasBase ? ` <span style="color:var(--muted)">vs ${baseDate}</span>` : ''}`) +
    tile('Put 总 OI', fmt(tp), `Δ ${signedSpan(dtp)}${hasBase ? ` <span style="color:var(--muted)">vs ${baseDate}</span>` : ''}`) +
    tile('Put / Call 比', tc > 0 ? (tp / tc).toFixed(2) : '—', 'OI 口径');
}

// ---------- main ----------
async function render() {
  const curDate = $('selCur').value, baseDate = $('selBase').value, expiry = $('selExp').value;
  const cur = await loadSnap(curDate);
  const base = baseDate && baseDate !== 'NONE' ? await loadSnap(baseDate) : null;
  const rows = buildDiff(cur, base, expiry);
  renderTiles(cur, rows, baseDate);
  const expTxt = expiry === 'ALL' ? '全部到期日合计' : `到期日 ${expiry}`;
  $('deltaNote').textContent = base
    ? `${expTxt} · ${curDate} 相对 ${baseDate} 的变化`
    : '暂无历史快照可对比——从第二个快照开始显示每日增减。';
  $('distNote').textContent = `${expTxt} · 快照日期 ${curDate}`;
  if (base) {
    renderDelta($('chartDeltaCall'), rows, 'dc', cur.spot, baseDate);
    renderDelta($('chartDeltaPut'), rows, 'dp', cur.spot, baseDate);
    $('putPanelTitle').style.display = '';
  } else {
    $('chartDeltaCall').innerHTML = '<div class="msg">明天开始有对比数据后自动显示</div>';
    $('chartDeltaPut').innerHTML = '';
    $('putPanelTitle').style.display = 'none';
  }
  renderDist($('chartDist'), rows.filter(r => r.c > 0 || r.p > 0), cur.spot);
  renderTable(rows, cur.spot);
  $('subline').textContent = `${cur.symbol} · 快照 ${curDate}（共 ${INDEX.dates.length} 天历史）`;
  $('fetchedAt').textContent = ` 本快照抓取于 ${cur.fetched_at} ET。`;
}

function fillSelect(sel, items, value) {
  sel.innerHTML = items.map(([v, t]) => `<option value="${v}"${v === value ? ' selected' : ''}>${t}</option>`).join('');
}

async function init() {
  const r = await fetch('data/index.json');
  INDEX = await r.json();
  const dates = INDEX.dates;
  const latest = dates[dates.length - 1];
  const prev = dates.length > 1 ? dates[dates.length - 2] : null;
  const cur = await loadSnap(latest);
  const expiries = [...new Set(cur.options.map(o => o[0]))].sort();
  fillSelect($('selExp'), [['ALL', '全部到期日'], ...expiries.map(e => [e, e])], expiries[0]);
  fillSelect($('selCur'), dates.slice().reverse().map(d => [d, d]), latest);
  const baseItems = prev ? dates.slice(0, -1).reverse().map(d => [d, d]) : [['NONE', '（暂无）']];
  fillSelect($('selBase'), baseItems, prev || 'NONE');
  const sync = () => {
    // base 日期必须早于数据日期
    const c = $('selCur').value;
    const opts = dates.filter(d => d < c);
    const keep = opts.includes($('selBase').value) ? $('selBase').value : opts[opts.length - 1];
    fillSelect($('selBase'), opts.length ? opts.reverse().map(d => [d, d]) : [['NONE', '（暂无）']], keep || 'NONE');
  };
  $('selCur').addEventListener('change', () => { sync(); render(); });
  $('selBase').addEventListener('change', render);
  $('selExp').addEventListener('change', render);
  await render();
}
init().catch(e => { $('subline').textContent = '加载失败：' + e.message; });
</script>
</body>
</html>
